<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>교실 배틀쉽</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="auth-screen">
        <div class="intro-content">
            <div class="main-logo">🚢</div>
            <h1>BATTLESHIP</h1>
            <p class="subtitle">교실 실시간 함대 전투</p>
            
            <div class="login-box">
                <input type="text" id="nickname" placeholder="팀명을 입력하세요">
                <div class="room-actions">
                    <button id="create-room-btn" class="primary-btn">새 작전 방 만들기</button>
                    <div class="join-divider">또는</div>
                    <div class="join-area">
                        <input type="text" id="join-code" placeholder="입장 코드 (4자리 숫자)">
                        <button id="join-room-btn" class="secondary-btn">참여하기</button>
                    </div>
                </div>
            </div>
            <p class="notice">* 방을 만들면 <span class="red-text">홍팀</span>, 참여하면 <span class="blue-text">청팀</span>이 됩니다.</p>
            
            <div style="margin-top: 15px;">
                <input type="password" id="global-reset-pw" placeholder="리셋 암호" style="width: 100px; padding: 5px;">
                <button id="global-reset-btn" style="padding: 5px;">방 초기화</button>
            </div>
        </div>
    </div>

    <div id="game-screen" class="hidden">
        <div class="status-bar">
            <div class="user-info">
                <span id="display-room" class="room-badge"></span>
                <span id="display-name"></span>
            </div>
            <div id="game-info">대기 중...</div>
        </div>

        <div class="boards-container">
            <div class="board-wrapper left">
                <h3>우리 함대 진지</h3>
                <div id="my-board" class="grid"></div>
                <div id="my-ship-status" class="ship-status-container"></div>
                
                <div id="ship-selector">
                    <div class="selector-header">
                        <span>함선 배치</span>
                        <button id="rotate-btn">방향: 가로</button>
                    </div>
                    <div class="ship-buttons">
                        <div class="ship-btn" data-size="4">
                            <span class="s-label">항공모함</span>
                            <div class="ship-visual"><div class="sc"></div><div class="sc"></div><div class="sc"></div><div class="sc"></div></div>
                        </div>
                        <div class="ship-btn" data-size="3">
                            <span class="s-label">순양함</span>
                            <div class="ship-visual"><div class="sc"></div><div class="sc"></div><div class="sc"></div></div>
                        </div>
                        <div class="ship-btn" data-size="2">
                            <span class="s-label">구축함1</span>
                            <div class="ship-visual"><div class="sc"></div><div class="sc"></div></div>
                        </div>
                        <div class="ship-btn" data-size="2">
                            <span class="s-label">구축함2</span>
                            <div class="ship-visual"><div class="sc"></div><div class="sc"></div></div>
                        </div>
                        <div class="ship-btn" data-size="1">
                            <span class="s-label">잠수함</span>
                            <div class="ship-visual"><div class="sc"></div></div>
                        </div>
                    </div>
                </div>
                <button id="ready-btn">전투 배치 완료</button>
            </div>

            <div class="board-wrapper right">
                <h3>상대 함대 진지</h3>
                <div id="enemy-board" class="grid"></div>
                <div id="enemy-ship-status" class="ship-status-container"></div>
                
                <div class="footer-area">
                    <p class="guide">적 함대를 클릭하여 공격하세요!</p>
                    <div class="admin-reset-area">
                        <input type="password" id="internal-reset-pw" placeholder="리셋 코드" style="width: 100px; padding: 5px;">
                        <button id="reset-btn" class="admin-btn">방 초기화</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
